name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build
        run: go build -o github_streak cmd/server/main.go

      - name: Run tests
        run: go test ./internal/service/

  cd:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ci  # only deploy if CI passes
    steps:
      - name: Trigger Render Deploy
        run: |
          curl --silent --show-error --fail \
            -X POST "${{ https://api.render.com/deploy/srv-db1nuv942hec73dihlng?key=OUFkb_Sdul4 }}"