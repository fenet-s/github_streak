<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Connected — Streak Guardian</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e6edf3;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #3fb950; }
    p  { color: #8b949e; line-height: 1.6; margin-bottom: 8px; }
    .username { color: #58a6ff; font-weight: 600; }
    .note {
      margin-top: 24px;
      padding: 16px;
      background: #1c2128;
      border-radius: 8px;
      border: 1px solid #30363d;
      font-size: 14px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>GitHub Connected!</h1>
    <p>Welcome, <span class="username">{{ .username }}</span>!</p>
    <p>Your GitHub account has been successfully linked to Streak Guardian.</p>
    <div class="note">
      🔙 You can now close this window and return to Telegram.<br><br>
      Send <strong>/status</strong> to see your current streak.
    </div>
  </div>
</body>
</html>
